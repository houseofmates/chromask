<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="popup.css" />
    <script src="shared.js"></script>
    <script src="popup.js"></script>
  </head>
  <body>
    <h2 id="maskStatus">the mask is off. i look like firefox to this site.</h2>
    <section class="toggle-wrap">
      <p class="label-off">firefox</p>
      <label class="toggle" for="mask_enabled">
        <input name="mask_enabled" type="checkbox" id="mask_enabled" />
        <div class="track"></div>
      </label>
      <p class="label-on">chrome</p>
    </section>
    <hr />
    <section id="preferences">
      <button id="preferencesButton"></button>
    </section>
    <section id="preferencesFallback" style="display: none">
      <p id="preferencesFallbackText"></p>
    </section>
    <hr />
    <p id="breakageWarning"></p>
    <p id="reportBrokenSite"></p>
  </body>
</html>
